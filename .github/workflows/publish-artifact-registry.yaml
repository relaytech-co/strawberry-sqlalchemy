name: Publish to Artifact Registry

# Relay-specific. Upstream's release.yml publishes to PyPI on push to main; this
# publishes our patched build to Relay's private registries and never runs on main.
# Exception to Relay's monorepo pattern; only exists because this fork can't live there.

on:
  push:
    tags:
      - "relay-v*"
    branches:
      - relay-main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency: publish-artifact-registry

jobs:
  publish:
    name: Publish to ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      # Publish to both independently; a failure in one shouldn't skip the other
      fail-fast: false
      matrix:
        include:
          - project: relaytech-sandbox
            workload_identity_provider_var: SANDBOX_WORKLOAD_IDENTITY
          - project: relaytech-production
            workload_identity_provider_var: PRODUCTION_WORKLOAD_IDENTITY
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ matrix.project }}
          workload_identity_provider: ${{ vars[matrix.workload_identity_provider_var] }}

      - name: Build and publish
        run: ./scripts/publish-to-artifact-registry.sh
        env:
          AR_REPOSITORY_URL: https://europe-west1-python.pkg.dev/${{ matrix.project }}/relaycode-python/
